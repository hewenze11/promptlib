apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: promptlib-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hewenze11/promptlib.git
    targetRevision: dev
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: promptlib
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
