name: Backend CI/CD

on:
  push:
    branches: [dev, main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yaml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Build & Test
        working-directory: backend
        run: |
          CGO_ENABLED=0 go build ./...

      - name: Configure insecure registry
        run: |
          echo '{"insecure-registries":["47.239.171.228"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          sleep 3

      - name: Build Docker image
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          docker build -t 47.239.171.228/promptlib/backend:dev-${SHORT_SHA} backend/
          echo "IMAGE_TAG=dev-${SHORT_SHA}" >> $GITHUB_ENV

      - name: Push to Harbor
        run: |
          docker login 47.239.171.228 -u admin -p '${{ secrets.HARBOR_PASSWORD }}' 2>/dev/null || \
          docker login http://47.239.171.228 -u admin -p '${{ secrets.HARBOR_PASSWORD }}'
          docker push 47.239.171.228/promptlib/backend:${{ env.IMAGE_TAG }}

      - name: Update manifest (dev only)
        if: github.ref == 'refs/heads/dev'
        run: |
          git config user.email "ci@promptlib.ai"
          git config user.name "CI"
          sed -i "s|newTag: .*|newTag: ${{ env.IMAGE_TAG }}|" k8s/overlays/dev/kustomization.yaml
          git add k8s/overlays/dev/kustomization.yaml
          git diff --staged --quiet || git commit -m "ci: update backend image to ${{ env.IMAGE_TAG }}"
          git push
