name: Backend CI/CD

on:
  push:
    branches: [dev, main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yaml'

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Build & verify
        working-directory: backend
        run: CGO_ENABLED=0 go build ./...

      - name: Set image tag
        run: echo "IMAGE_TAG=dev-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Configure insecure registry
        run: |
          echo '{"insecure-registries":["47.239.171.228"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker && sleep 3

      - name: Build Docker image
        run: docker build -t 47.239.171.228/promptlib/backend:${{ env.IMAGE_TAG }} backend/

      - name: Push to Harbor
        run: |
          docker login 47.239.171.228 -u admin -p '${{ secrets.HARBOR_PASSWORD }}'
          docker push 47.239.171.228/promptlib/backend:${{ env.IMAGE_TAG }}
          docker tag 47.239.171.228/promptlib/backend:${{ env.IMAGE_TAG }} \
                     47.239.171.228/promptlib/backend:dev-latest
          docker push 47.239.171.228/promptlib/backend:dev-latest

      - name: Update kustomization (dev only)
        if: github.ref == 'refs/heads/dev'
        run: |
          git config user.email "ci@promptlib.ai"
          git config user.name "CI Bot"
          sed -i "/name: 47.239.171.228\/promptlib\/backend/{n;s/newTag: .*/newTag: ${{ env.IMAGE_TAG }}/}" \
            k8s/overlays/dev/kustomization.yaml
          git add k8s/overlays/dev/kustomization.yaml
          git diff --staged --quiet || git commit -m "ci: backend image ${{ env.IMAGE_TAG }}"
          git push

