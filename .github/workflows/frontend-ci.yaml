name: Frontend CI/CD

on:
  push:
    branches: [dev, main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package*.json'
      - 'Dockerfile'
      - 'nginx.k8s.conf'
      - '.github/workflows/frontend-ci.yaml'

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=dev-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Configure insecure registry
        run: |
          echo '{"insecure-registries":["47.239.171.228"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker && sleep 3

      - name: Build Docker image
        run: docker build -t 47.239.171.228/promptlib/frontend:${{ env.IMAGE_TAG }} .

      - name: Push to Harbor
        run: |
          docker login 47.239.171.228 -u admin -p '${{ secrets.HARBOR_PASSWORD }}'
          docker push 47.239.171.228/promptlib/frontend:${{ env.IMAGE_TAG }}
          docker tag 47.239.171.228/promptlib/frontend:${{ env.IMAGE_TAG }} \
                     47.239.171.228/promptlib/frontend:dev-latest
          docker push 47.239.171.228/promptlib/frontend:dev-latest

      - name: Update kustomization (dev only)
        if: github.ref == 'refs/heads/dev'
        run: |
          git config user.email "ci@promptlib.ai"
          git config user.name "CI Bot"
          sed -i "/name: 47.239.171.228\/promptlib\/frontend/{n;s/newTag: .*/newTag: ${{ env.IMAGE_TAG }}/}" \
            k8s/overlays/dev/kustomization.yaml
          git add k8s/overlays/dev/kustomization.yaml
          git diff --staged --quiet || git commit -m "ci: frontend image ${{ env.IMAGE_TAG }}"
          git push
